[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockmarket-rag-pipeline"
version = "0.1.0"
description = "Enterprise Data Engineering & RAG Pipeline for Stock Market SEC Filings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Data Engineering Team"}
]

dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "SQLAlchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "qdrant-client>=1.9.0",
    "langchain>=0.2.0",
    "openai>=1.30.0",
    "loguru>=0.7.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.9.0",
    "ipykernel>=6.29.0"
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
