app:
  name: "StockMarket_RAG_Pipeline"
  environment: "development"

data_lake:
  base_dir: "data"
  raw_dir: "data/01_raw"
  staging_dir: "data/02_staging"
  primary_dir: "data/03_primary"
  curated_dir: "data/04_curated"

ingestion:
  sec_api:
    base_url: "https://api.sec-api.io"
    exchanges:
      - "NYSE"
      - "NASDAQ"
    timeout_seconds: 30

rag:
  chunk_size: 1000
  chunk_overlap: 200
  embedding_model: "text-embedding-3-small"
  vector_store:
    provider: "qdrant"
    collection_name: "financial_reports"
    distance: "Cosine"
